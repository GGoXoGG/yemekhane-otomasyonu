<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <script type="module" src="/js/giris.js"></script>
</head>
<body class="giris">
  <main class="giris-kart">
    <div class="giris-kimlik">
      <span class="isaret" aria-hidden="true"><span></span></span>
      <h1>Yemekhane<br> Otomasyonu</h1>
    </div>
    <form id="giris" class="giris-form">
      <h2>Oturum aç</h2>
      <label for="eposta">E-posta</label>
      <input id="eposta" name="eposta" type="email" autocomplete="username" maxlength="120" required>
      <label for="sifre">Şifre</label>
      <input id="sifre" name="sifre" type="password" autocomplete="current-password" required>
      <button class="dugme" type="submit">Giriş yap</button>
      <p id="bildirim" role="status" hidden></p>
    </form>
  </main>
</body>
</html>
