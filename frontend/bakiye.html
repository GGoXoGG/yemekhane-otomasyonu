<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakiye · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <script type="module" src="/js/hesap.js"></script>
</head>
<body data-sayfa="bakiye">
  <header id="ust" class="ust" hidden></header>
  <div class="kapsayici yerlesim">
    <nav id="gezinti" class="gezinti" aria-label="Ana menü" hidden></nav>
    <p id="ilk-hata" class="bildirim bildirim-hata" role="status" hidden></p>
    <main id="icerik" hidden>
      <h1>Bakiye</h1>
      <div id="bildirimler" role="status" class="bildirim-alani"></div>
      <div class="bakiye-duzen">
        <section class="panel bakiye-ozeti" aria-label="Güncel bakiye">
          <h2>Güncel bakiye</h2>
          <p id="bakiye-toplam" class="buyuk-tutar">—</p>
        </section>
        <form id="bakiye-formu" class="panel">
          <h2>Bakiye yükle</h2>
          <label for="tutar">Tutar (TL)</label>
          <div class="form-satiri">
            <input id="tutar" name="tutar" type="number" inputmode="decimal" min="10" max="1000" step="0.01" required>
            <button type="submit" class="dugme">Yükle</button>
          </div>
          <p class="yardim">10–1.000 TL arası sanal bakiye.</p>
        </form>
      </div>
      <section class="panel">
        <h2>Hareket geçmişi</h2>
        <div id="hareketler"></div>
      </section>
    </main>
  </div>
</body>
</html>
